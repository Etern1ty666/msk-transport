server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css text/csv;

  location / { try_files $uri /index.html; }
  # index.html не кэшируем — после обновления сразу подтягивается новая сборка; ассеты с хешем в имени — навсегда
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~ ^/(api|docs|openapi.json|redoc) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
