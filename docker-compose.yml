# Запуск: DATASET_DIR=../dataset docker compose up --build   →  http://localhost:8080
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATASET_DIR: /dataset
    volumes:
      # папка распакованного dataset.zip (labels/, spravochniki/, train.csv, test.csv)
      - ${DATASET_DIR:-../dataset}:/dataset:ro
    ports: ["8000:8000"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    restart: unless-stopped
  frontend:
    build: { context: ./frontend }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
